</section>

    <!-- Image Section -->
    <main>
        <section class="portfolio-section" aria-labelledby="portfolio-heading">
            <h2 id="portfolio-heading">Featured Work</h2>

            <div id="gallery" class="masonry-grid"><div class="masonry-item"><img src="Images/BENJI_15-copy.jpg" alt="BENJI_15-copy.jpg"></div><div class="masonry-item"><img src="Images/REMMIE21779.jpg" alt="REMMIE21779.jpg"></div><div class="masonry-item"><img src="Images/REMMIE22152.jpg" alt="REMMIE22152.jpg"></div><div class="masonry-item"><img src="Images/BENJI_11-copy.jpg" alt="BENJI_11-copy.jpg"></div><div class="masonry-item"><img src="Images/BW3.jpg" alt="BW3.jpg"></div><div class="masonry-item"><img src="Images/REMMIE21986.jpg" alt="REMMIE21986.jpg"></div><div class="masonry-item"><img src="Images/BW1.jpg" alt="BW1.jpg"></div><div class="masonry-item"><img src="Images/Black-Hoodie-F-3.jpg" alt="Black-Hoodie-F-3.jpg"></div><div class="masonry-item"><img src="Images/TONY_3.jpg" alt="TONY_3.jpg"></div><div class="masonry-item"><img src="Images/REMMIE21866.jpg" alt="REMMIE21866.jpg"></div><div class="masonry-item"><img src="Images/TONY_6.jpg" alt="TONY_6.jpg"></div><div class="masonry-item"><img src="Images/BW2.jpg" alt="BW2.jpg"></div><div class="masonry-item"><img src="Images/BENJI_6-copy.jpg" alt="BENJI_6-copy.jpg"></div><div class="masonry-item"><img src="Images/REMMIE21756.jpg" alt="REMMIE21756.jpg"></div><div class="masonry-item"><img src="Images/BENJI_9-copy.jpg" alt="BENJI_9-copy.jpg"></div><div class="masonry-item"><img src="Images/TONY_5.jpg" alt="TONY_5.jpg"></div><div class="masonry-item"><img src="Images/BENJI_5-copy.jpg" alt="BENJI_5-copy.jpg"></div><div class="masonry-item"><img src="Images/REMMIE22104.jpg" alt="REMMIE22104.jpg"></div><div class="masonry-item"><img src="Images/BENJI_8-copy.jpg" alt="BENJI_8-copy.jpg"></div><div class="masonry-item"><img src="Images/BENJI_10-copy.jpg" alt="BENJI_10-copy.jpg"></div><div class="masonry-item"><img src="Images/TONY_7.jpg" alt="TONY_7.jpg"></div><div class="masonry-item"><img src="Images/TONY_2.jpg" alt="TONY_2.jpg"></div><div class="masonry-item"><img src="Images/DONNY_10-copy.jpg" alt="DONNY_10-copy.         <p>Socials – tajmccafferty.photo</p>
        <p>Contact – 0401 801 850</p>

    </footer>

<script>
const images = [
    "BENJI_10-copy.jpg",
    "BENJI_11-copy.jpg",
    "BENJI_15-copy.jpg",
    "BENJI_5-copy.jpg",
    "BENJI_6-copy.jpg",
    "BENJI_8-copy.jpg",
    "BENJI_9-copy.jpg",
    "BW1.jpg",
    "BW2.jpg",
    "BW3.jpg",
    "Black-Hoodie-F-3.jpg",
    "DONNY_10-copy.jpg",
    "REMMIE21756.jpg",
    "REMMIE21779.jpg",
    "REMMIE21866.jpg",
    "REMMIE21986.jpg",
    "REMMIE22104.jpg",
    "REMMIE22152.jpg",
    "TONY_2.jpg",
    "TONY_3.jpg",
    "TONY_5.jpg",
    "TONY_6.jpg",
    "TONY_7.jpg"
];

for (let i = images.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [images[i], images[j]] = [images[j], images[i]];
}

const gallery = document.getElementById('gallery');

images.forEach(filename => {
    const item = document.createElement('div');
    item.className = 'masonry-item';

    const img = document.createElement('img');
    img.src = `Images/${filename}`;
    img.alt = filename;

    item.appendChild(img);
    gallery.appendChild(item);
});
</script>



</body></html>
