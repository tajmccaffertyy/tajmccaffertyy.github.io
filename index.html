<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Taj. Mc Photos – Portfolio</title>

    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- Inline override to make the header black and ensure nav links are visible -->
    <style>
        
    </style>
</head>

<body>

    <!-- Navigation (hero-subtitle used as nav links) -->
    <header class="nav-section" role="banner" aria-hidden="false">
        <div class="nav-container">
            <div class="logo" aria-hidden="false" title="Taj. Mc Photos logo">
                <!-- Replaced inline SVG (Logo-B.svg) with Vector.png -->
                <img src="Images/Vector.png" alt="Taj. Mc Photos logo" width="100" height="100">
            </div>

            <nav class="main-nav" aria-label="Main navigation">
                <p class="hero-subtitle" aria-hidden="false">
                    <a href="#portfolio">Portfolio.</a>
                    <a href="#services">Services.</a>
                    <a href="#about">About.</a>
                    <a href="#contact">Contact.</a>
                </p>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero-section" aria-labelledby="hero-heading">
        <div class="hero-content">
            <h1 id="hero-heading">Capturing Space Through the Lens</h1>
        </div>
    </section>


    <!-- Image Section moved to bottom -->
    <main>
        <section class="portfolio-section" aria-labelledby="portfolio-heading">
            <h2 id="portfolio-heading">Featured Work</h2>

            <div id="gallery" class="masonry-grid"></div>
        </section>
    </main>


    <!-- Footer -->
    <footer class="footer-section">
        <p>Socials – tajmccafferty.photo</p>
        <p>Contact – 0401 801 850</p>
        <p>Email – taj.mccafferty@gmail.com</p>
    </footer>

<script>
const images = [
    "BENJI_10-copy.jpg",
    "BENJI_11-copy.jpg",
    "BENJI_15-copy.jpg",
    "BENJI_5-copy.jpg",
    "BENJI_6-copy.jpg",
    "BENJI_8-copy.jpg",
    "BENJI_9-copy.jpg",
    "BW1.jpg",
    "BW2.jpg",
    "BW3.jpg",
    "Black-Hoodie-F-3.jpg",
    "DONNY_10-copy.jpg",
    "REMMIE21756.jpg",
    "REMMIE21779.jpg",
    "REMMIE21866.jpg",
    "REMMIE21986.jpg",
    "REMMIE22104.jpg",
    "REMMIE22152.jpg",
    "TONY_2.jpg",
    "TONY_3.jpg",
    "TONY_5.jpg",
    "TONY_6.jpg",
    "TONY_7.jpg"
];

for (let i = images.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [images[i], images[j]] = [images[j], images[i]];
}

const gallery = document.getElementById('gallery');

images.forEach(filename => {
    const item = document.createElement('div');
    item.className = 'masonry-item';

    const img = document.createElement('img');
    img.src = `Images/${filename}`;
    img.alt = filename;

    item.appendChild(img);
    gallery.appendChild(item);
});
</script>



</body>
</html>
